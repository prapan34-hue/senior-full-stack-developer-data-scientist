services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dengue_db
      POSTGRES_USER: dengue
      POSTGRES_PASSWORD: dengue_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dengue -d dengue_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
